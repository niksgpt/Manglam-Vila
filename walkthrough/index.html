<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Manglam Vila Walkthrough</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #f4efe6; --dim: #c9c0b1; --panel: rgba(24, 20, 17, 0.62); --line: rgba(244, 239, 230, 0.16);
    --brass: #d2a85c; --brass-ink: #1d1712;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14110f; color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #caption { position: fixed; left: 16px; top: 16px; padding: 10px 14px 11px; min-width: 150px; pointer-events: none;
    transition: opacity .35s; }
  #caption .name { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  #caption .size { color: var(--dim); font-size: 13px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  #caption .tag { color: var(--brass); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
  #mapwrap { position: fixed; right: 16px; top: 16px; padding: 8px; }
  #map { display: block; width: 132px; height: 216px; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
  #row1 { display: flex; align-items: center; gap: 10px; }
  #row0 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #row0 .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
  #row0 .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  #row0 .seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; }
  #row0 .seg button + button { border-left: 1px solid var(--line); }
  #row0 button.on { background: var(--ink); color: var(--brass-ink); }
  #row0 .gap { flex: 1; }
  button { font: inherit; color: var(--ink); background: rgba(244, 239, 230, 0.08); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(244, 239, 230, 0.16); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  #play { background: var(--brass); color: var(--brass-ink); border-color: transparent; font-weight: 600; min-width: 118px; }
  #play:hover { background: #dfb76c; }
  #track { flex: 1; height: 6px; border-radius: 3px; background: rgba(244, 239, 230, 0.16); position: relative; cursor: pointer; min-width: 40px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--brass); }
  #time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
  #stops { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  #stops::-webkit-scrollbar { display: none; }
  #stops button { padding: 5px 10px; font-size: 12.5px; color: var(--dim); }
  #stops button.on { color: var(--brass-ink); background: var(--ink); }
  /* time of day */
  #todwrap { display: flex; align-items: center; gap: 8px; }
  #todwrap .ends { display: flex; gap: 0; }
  #tod { -webkit-appearance: none; appearance: none; width: 190px; height: 6px; border-radius: 3px; cursor: pointer;
    background: linear-gradient(90deg, #f6d9a8 0%, #cfe3f6 30%, #f1c98e 55%, #e8843c 72%, #46386a 86%, #10142c 100%); }
  #tod::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 2px solid var(--brass-ink); box-shadow: 0 0 0 1px var(--line); }
  #tod::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--brass-ink); }
  #todlbl { color: var(--dim); font-size: 12.5px; min-width: 132px; font-variant-numeric: tabular-nums; }
  #todwrap button { padding: 5px 8px; font-size: 12px; color: var(--dim); }
  /* floor buttons appear with the dollhouse view */
  #floors { display: none !important; }
  body.doll:not(.onefloor) #floors { display: flex !important; }
  /* big Start Tour button and the label shown at each stop */
  #start { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); padding: 14px 26px; font-size: 17px; font-weight: 600;
    background: var(--brass); color: var(--brass-ink); border-color: transparent; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transition: opacity .4s, transform .4s; }
  #start:hover { background: #dfb76c; }
  #start.gone { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }
  #label { position: fixed; left: 50%; bottom: 196px; transform: translateX(-50%); padding: 12px 18px 13px; text-align: center; pointer-events: none;
    min-width: 240px; max-width: min(460px, calc(100% - 24px)); transition: opacity .5s, transform .5s; }
  #label.hide { transform: translate(-50%, 10px); }
  #label .f { color: var(--brass); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  #label .n { font-size: 20px; font-weight: 600; margin-top: 1px; }
  #label .a { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 1px; }
  #label .s { color: var(--dim); font-size: 13.5px; margin-top: 5px; }
  #hint { position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%); padding: 7px 12px; font-size: 12.5px;
    color: var(--dim); pointer-events: none; transition: opacity .6s; text-align: center; max-width: calc(100% - 24px); width: max-content; }
  @media (pointer: coarse) { #hint .kb { display: none; } }
  #fade { position: fixed; inset: 0; background: #0d0b0a; opacity: 0; pointer-events: none; transition: opacity .55s; }
  #loading { position: fixed; inset: 0; background: #14110f; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; transition: opacity .6s; }
  #loading .t { font-size: 20px; font-weight: 600; }
  #loading .s { color: var(--dim); }
  #end { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 18px 20px; text-align: center;
    display: none; }
  #end .t { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  #end .s { color: var(--dim); margin-bottom: 12px; }
  #end button { margin: 0 3px; }
  #editlink { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; white-space: nowrap; background: rgba(244, 239, 230, 0.08); }
  #editlink:hover { background: rgba(244, 239, 230, 0.16); }
  #notice { position: fixed; left: 16px; top: 92px; max-width: 300px; padding: 8px 12px; font-size: 12.5px; color: var(--dim); display: none; }
  #notice a { color: var(--brass); }
  .hide { opacity: 0 !important; }
  @media (max-width: 760px) {
    #caption { left: 10px; top: 10px; } #mapwrap { right: 10px; top: 10px; padding: 6px; }
    #map { width: 92px; height: 151px; } #bar { left: 10px; right: 10px; bottom: 10px; }
    #time, #editlink, #todwrap .ends { display: none; } #hint { display: none; } #play { min-width: 104px; }
    #tod { width: 120px; } #todlbl { min-width: 0; } #start { bottom: 250px; } #label { bottom: 240px; }
  }
  body.debug .panel, body.debug #hint, body.debug #start { display: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="caption" class="panel"><div class="tag">Ground floor</div><div class="name">&nbsp;</div><div class="size">&nbsp;</div></div>
<div id="mapwrap" class="panel"><canvas id="map" width="264" height="432"></canvas></div>
<div id="hint" class="panel">Drag to look, or press Mouse look <span class="kb">&nbsp;·&nbsp; W A S D to walk</span> &nbsp;·&nbsp; tap the floor to move</div>
<div id="label" class="panel hide"><div class="f">&nbsp;</div><div class="n">&nbsp;</div><div class="a">&nbsp;</div><div class="s">&nbsp;</div></div>
<button id="start" type="button">▶&nbsp; Start Tour</button>

<div id="bar" class="panel">
  <div id="row0">
    <span class="lbl">Style</span>
    <div class="seg"><button type="button" data-style="modern">Modern</button><button type="button" data-style="scandi">Scandinavian</button><button type="button" data-style="luxury">Warm luxury</button></div>
    <div id="todwrap">
      <span class="lbl" style="margin-left:6px">Time</span>
      <input id="tod" type="range" min="0" max="1000" step="1" value="550" aria-label="Time of day, from morning to night">
      <span id="todlbl">&nbsp;</span>
      <span class="ends"><button type="button" data-tod="0" title="Morning">Morning</button><button type="button" data-tod="0.72" title="Sunset">Sunset</button><button type="button" data-tod="1" title="Night">Night</button></span>
    </div>
    <span class="gap"></span>
    <button id="mute" type="button" title="Background music, made in the browser. Starts with the tour.">♪ Music on</button>
    <button id="mlook" type="button" title="Capture the mouse to look around; Esc releases it">Mouse look</button>
    <div class="seg" id="floors"><button type="button" data-floor="ground">Ground floor</button><button type="button" data-floor="first">First floor</button></div>
    <button id="doll" type="button" title="See the home from above with the roof off">Dollhouse view</button>
  </div>
  <div id="row1">
    <button id="play" type="button">▶ Start tour</button>
    <button id="restart" type="button" title="Start again">Restart</button>
    <a id="editlink" href="editor.html" title="Change walls, doors, windows and pillars">Edit plan</a>
    <div id="track"><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
  </div>
  <div id="stops"></div>
</div>

<div id="end" class="panel">
  <div class="t">Tour complete</div>
  <div class="s">Drag to turn the home, walk around on your own, or watch it again.</div>
  <button id="again" type="button">Watch again</button>
  <button id="explore" type="button">Explore</button>
</div>

<div id="notice" class="panel"></div>
<div id="fade"></div>
<div id="loading"><div class="t">Manglam Vila</div><div class="s" id="loadmsg">Building the model…</div></div>

</body>
